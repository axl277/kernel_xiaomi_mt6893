name: Build kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev ccache zip

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh chopin -ksu

      - name: Generate Release Tag
        run: echo "BUILD_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Axlorin-${{ env.BUILD_DATE }}
          name: Axlorin OSS Build - ${{ env.BUILD_DATE }}
          body: "Automated kernel build for chopin."
          files: |
            *.zip
